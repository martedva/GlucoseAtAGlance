<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#4CAF50" stroke="#388E3C" stroke-width="3"/>
  
  <!-- Arrow with rotation: 45° -->
  <g transform="translate(64, 64) rotate(45)">
    <!-- Arrow shaft -->
    <line x1="0" y1="25" x2="0" y2="-25" stroke="white" stroke-width="10" stroke-linecap="round"/>
    <!-- Arrow head -->
    <polygon points="-12,-15 0,-35 12,-15" fill="white"/>
  </g>
</svg>